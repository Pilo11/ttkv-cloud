name: CI

# Every pull request; a merged pull request runs it again through the workflow Release, on the merge
# commit, before it builds. A push to main alone runs nothing. GitHub's runners (the repository is
# public, so they cost nothing).
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (.NET 10)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build TtkvCloud/TtkvCloud.sln -c Release --nologo

  # The production stack as the server starts it, without the tunnel: the image builds, runs as the
  # runner's user with a read-only file system, reads the Staffelleitung key from its secret file and
  # answers /healthz; a restart keeps the data.
  stack:
    name: Deployment stack (deploy/)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: |
          for script in deploy/up.sh deploy/down.sh deploy/scripts/rollout.sh; do bash -n "$script"; done
          echo "DATA_DIR=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
      - run: ./deploy/up.sh
      - name: Check the running stack
        run: |
          fail() { echo "::error::$*"; exit 1; }
          base=http://127.0.0.1:18090
          curl -fsS "$base/healthz" | grep -qx Healthy || fail "/healthz is not Healthy"
          curl -fsS -o /dev/null "$base/" || fail "/ does not answer"
          key="$(cat deploy/secrets/termine_admin_key)"
          [[ "$(curl -s -o /dev/null -w '%{http_code}' "$base/staffelleitung/$key")" == 200 ]] || fail "the Staffelleitung does not answer under the key of secrets/termine_admin_key"
          [[ "$(curl -s -o /dev/null -w '%{http_code}' "$base/staffelleitung/not-the-key-0123456789")" == 404 ]] || fail "the Staffelleitung answers under another key"
          [[ "$(curl -s -o /dev/null -w '%{http_code}' "$base/staffelleitung/$key/mytt")" == 200 ]] || fail "the myTT page does not answer under the key"
          [[ "$(curl -s -o /dev/null -w '%{http_code}' "$base/staffelleitung/not-the-key-0123456789/mytt")" == 404 ]] || fail "the myTT page answers under another key"
          [[ "$(curl -s -o /dev/null -w '%{http_code}' "$base/mytt")" == 404 ]] || fail "the myTT page answers without the key"
          [[ "$(curl -fsS "$base/")" != *mytt* ]] || fail "the public start page links to the myTT page"
          user="$(docker compose -f deploy/docker-compose.yml exec -T app id -u)"
          [[ "$user" == "$(id -u)" ]] || fail "the app runs as $user, not as the deploy user $(id -u)"
          ls -A "$DATA_DIR/dataprotection-keys" | grep -q . || fail "no data-protection key in DATA_DIR"
      # A Spielplan created through the Staffelleitung survives `docker compose restart` and
      # ./down.sh + ./up.sh (new containers), and DATA_DIR stays byte for byte the same.
      - name: Restart keeps the data
        run: |
          fail() { echo "::error::$*"; exit 1; }
          base=http://127.0.0.1:18090
          key="$(cat deploy/secrets/termine_admin_key)"
          jar="$RUNNER_TEMP/cookies"
          form="$(curl -fsS -c "$jar" "$base/staffelleitung/$key/neu")"
          [[ "$form" =~ name=\"__RequestVerificationToken\"\ type=\"hidden\"\ value=\"([^\"]+)\" ]] || fail "no antiforgery token on the new Spielplan form"
          [[ "$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' \
            --data-urlencode "__RequestVerificationToken=${BASH_REMATCH[1]}" --data-urlencode "Name=CI Neustart" \
            --data-urlencode "DateFrom=2027-01-11" --data-urlencode "DateTo=2027-01-24" \
            "$base/staffelleitung/$key/neu?handler=Create")" == 302 ]] || fail "creating a Spielplan failed"
          listed() { [[ "$(curl -fsS "$base/staffelleitung/$key")" == *"CI Neustart"* ]]; }
          snapshot() { find "$DATA_DIR" -type f | sort | xargs sha256sum; }
          listed || fail "the new Spielplan is not listed"
          [[ -n "$(find "$DATA_DIR/cache/termine" -name '*.json' ! -name tenants-index.json)" ]] || fail "the Spielplan is not in DATA_DIR"
          before="$(snapshot)"

          docker compose -f deploy/docker-compose.yml restart
          for _ in $(seq 60); do curl -fsS -o /dev/null "$base/healthz" 2>/dev/null && break; sleep 2; done
          listed || fail "docker compose restart lost the Spielplan"

          ./deploy/down.sh
          ./deploy/up.sh
          listed || fail "./down.sh + ./up.sh lost the Spielplan"
          [[ "$before" == "$(snapshot)" ]] || fail "a restart changed DATA_DIR"
      - name: Logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: ./deploy/down.sh

  # The version Release would give this commit, with Release's own steps (.github/actions/release-version):
  # an update that breaks GitVersion fails here, never first the release after the merge.
  release-version:
    name: Release version (GitVersion as Release runs it)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        uses: ./.github/actions/release-version
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "### Release version: merged into main, this commit would release $VERSION" >> "$GITHUB_STEP_SUMMARY"
