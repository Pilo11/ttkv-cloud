# The production stack (deploy/README.md). The root docker-compose.yml stays the local quick start.
#
# The internet reaches the app only through a Cloudflare Tunnel (service cloudflared, profile
# `tunnel`): cloudflared dials out to Cloudflare and forwards the public host name to app:8080, so the
# server publishes no public port and TLS ends at Cloudflare's edge. The app is also published on
# 127.0.0.1:HTTP_PORT (for checks on the server or an SSH tunnel), never publicly. Without the profile
# (CI, a workstation) that is the only entry.
#
# Secrets are files in ./secrets/ (git-ignored; on the server written by the rollout from the GitHub
# environment production, in a checkout generated by ./up.sh), mounted under /run/secrets, never
# environment variables or .env.
#
# All state lives in DATA_DIR (the Spielpläne and the data-protection keys), host directories of the
# deploy user; the app runs as that user (DATA_USER), never root, with a read-only file system. A
# rollout, ./down.sh + ./up.sh or a reboot recreates the containers and keeps the data.
#
# The app's image is ttkv-cloud:<version> and never comes from a registry (pull_policy: never): a
# checkout builds it as :dev, a release bundle (VERSION) runs the one its rollout loaded from the
# GitHub release.
#
# Settings come from .env (on the server the rollout writes it from stages/<stage>.conf).
#   cd deploy && ./up.sh    # every start
name: ttkv-cloud-deploy

secrets:
  # The secret path of the Staffelleitung (/staffelleitung/<key>). The app reads it as the
  # configuration key Termine:AdminKey (file name Termine__AdminKey, Program.cs).
  termine_admin_key:
    file: ./secrets/termine_admin_key
  # Token of the Cloudflare Tunnel (Zero Trust dashboard), profile `tunnel` only.
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token

# No way back to root (setuid binaries, file capabilities) and no Linux capability.
x-non-root: &non-root
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  networks: [internal]

services:
  app:
    <<: *non-root
    image: ttkv-cloud:${TTKV_VERSION:-dev}
    pull_policy: never
    build:
      context: ../TtkvCloud/CloudServices
    # The owner of DATA_DIR (up.sh sets it in a checkout, the rollout writes it into .env).
    user: ${DATA_USER:-1654:1654}
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ASPNETCORE_URLS: http://+:8080
      # cloudflared sends X-Forwarded-Proto: https, so copied links start with https:// and the
      # click-TT cookies keep their Secure flag. Only cloudflared and the host reach port 8080.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      CACHE_ROOT: /data/cache
      DataProtection__KeysPath: /data/dataprotection-keys
    secrets:
      - source: termine_admin_key
        target: Termine__AdminKey
    volumes:
      - ${DATA_DIR:-./data}/cache:/data/cache
      - ${DATA_DIR:-./data}/dataprotection-keys:/data/dataprotection-keys
    ports:
      - "127.0.0.1:${HTTP_PORT:-18090}:8080"
    healthcheck:
      # The image has neither curl nor wget: bash asks /healthz itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # A remotely-managed tunnel with one route in the Cloudflare dashboard: the public host name ->
  # http://app:8080 (deploy/README.md, step 2). Stateless: its identity is the token, so a restart
  # reconnects the same tunnel. The image runs as 65532:65532.
  cloudflared:
    <<: *non-root
    image: cloudflare/cloudflared:2026.11.1
    profiles: [tunnel]
    # Metrics and /ready on 127.0.0.1 inside the container only, for the health check.
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    depends_on:
      app:
        condition: service_healthy
    secrets:
      - cloudflare_tunnel_token
    healthcheck:
      # Healthy once at least one connection to Cloudflare's edge is up.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  internal:
